[project]
name = "job-courier"
version = "0.1"
description = "JobCourier — BOSS 直聘智能投递助手（FastAPI 后端 + React 前端）"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "fastapi>=0.142.2",
    "lxml>=5.0",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0",
    "opentelemetry-sdk>=1.39.0",
    "patchright>=1.63.0",
    "pydantic>=2.0",
    "pydantic-ai-slim[openai]>=2.49.0",
    "pypdf>=6.19.0",
    "pyquery>=2.1.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "rapidocr-onnxruntime>=1.4.4",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["frontend", "user_data", "upload", ".venv"]

[tool.ruff.lint]
# 默认规则（E4/E7/E9/F）之外，额外补上 import 排序与常见笔误
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.pyright]
venvPath = "."
venv = ".venv"
